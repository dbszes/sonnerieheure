<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Sonnerie horaire</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">
    <section class="card">

```
  <div class="badge">🔔 SONNERIE</div>

  <h1>Sonnerie horaire</h1>

  <p class="subtitle">
    Lance <strong>sonnerie.webm</strong> automatiquement selon ton réglage.
  </p>

  <div class="clock" id="clock">--:--:--</div>

  <div class="status" id="status">
    Désactivée
  </div>

  <div class="controls">

    <label class="switch-row">
      <span>Activer la sonnerie</span>

      <input type="checkbox" id="enabled">

      <span class="switch"></span>
    </label>

    <div class="settings">

      <label for="mode">Mode</label>

      <select id="mode">
        <option value="hourly">
          Toutes les heures
        </option>

        <option value="custom">
          Heure précise
        </option>
      </select>

      <label
        for="customTime"
        id="customLabel"
        class="hidden">
        Heure de sonnerie
      </label>

      <input
        type="time"
        id="customTime"
        class="hidden"
        value="08:00">
    </div>

    <button
      id="testButton"
      class="secondary">
      ▶ Tester la sonnerie
    </button>

  </div>

  <div class="next">
    <span>Prochaine sonnerie</span>

    <strong id="nextBell">
      —
    </strong>
  </div>

  <p class="hint">
    ⚠️ Garde cette page ouverte.
    Pour autoriser la lecture automatique du son,
    clique une fois sur « Tester la sonnerie ».
  </p>

</section>
```

  </main>

  <!-- Place sonnerie.webm dans le même dossier que ce fichier -->

<audio
 id="bell"
 src="sonnerie.webm"
 preload="auto"> </audio>

  <script src="script.js"></script>

</body>
</html>
